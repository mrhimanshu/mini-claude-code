[project]
name = "mini-claude-code"
version = "0.1.0"
description = "A LangGraph-based Claude Code agent with tools, subagents, teams, and worktree isolation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-anthropic>=1.3.4",
    "langchain-core>=1.2.16",
    "langgraph>=1.0.9",
    "prompt-toolkit>=3.0.52",
    "python-dotenv>=1.2.1",
    "rich>=14.3.3",
]

[project.scripts]
mini-claude = "mini_claude_code.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_claude_code"]
